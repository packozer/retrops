<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Rétrops — Rétrospectives d'équipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Manrope:wght@400;500;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#17211C;
    --canvas-alt:#1C2820;
    --panel:#223027;
    --panel-2:#28382D;
    --line:rgba(244,241,232,0.10);
    --line-strong:rgba(244,241,232,0.22);
    --ink:#F4F1E8;
    --ink-dim:rgba(244,241,232,0.60);
    --ink-faint:rgba(244,241,232,0.38);
    --accent:#FF6B4A;
    --accent-ink:#241209;
    --accent-dim:rgba(255,107,74,0.18);
    --danger:#E8607A;

    --note-1:#FFD64D; --note-1-ink:#3A2E05;
    --note-2:#FF9EC4; --note-2-ink:#3D0F22;
    --note-3:#6FCBEB; --note-3-ink:#0B2E3A;
    --note-4:#A8E6A1; --note-4-ink:#12300E;
    --note-5:#C9A8F5; --note-5-ink:#2A1240;
    --note-6:#FFB37B; --note-6-ink:#3A1C05;

    --tape-1:#F2C14E; --tape-2:#5FA8D3; --tape-3:#EF767A; --tape-4:#7FB77E; --tape-5:#B295C7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 1px 1px, rgba(244,241,232,0.05) 1px, transparent 1.6px) 0 0/22px 22px,
      var(--canvas);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{font-family:inherit;}
  ::selection{background:var(--accent); color:var(--accent-ink);}
  .hand{font-family:'Kalam',cursive;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- layout ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- LOADING OVERLAY ---------- */
  .loading-overlay{
    position:fixed; inset:0; background:rgba(23,33,28,0.85);
    display:flex; align-items:center; justify-content:center; z-index:200;
  }
  .spinner{
    width:40px; height:40px; border:3px solid var(--line-strong);
    border-top-color:var(--accent); border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- HOME ---------- */
  .home{
    flex:1; display:flex; flex-direction:column; align-items:center;
    padding:56px 20px 40px; gap:36px;
  }
  .home-hero{text-align:center; max-width:640px;}
  .home-hero .brand{
    font-family:'Kalam',cursive; font-weight:700; font-size:44px;
    letter-spacing:0.5px; margin:0 0 6px;
    transform:rotate(-1.5deg); display:inline-block;
  }
  .home-hero .brand .dot{color:var(--accent);}
  .home-hero p{color:var(--ink-dim); font-size:15px; line-height:1.6; margin:0;}

  .home-cards{display:flex; gap:20px; flex-wrap:wrap; justify-content:center; width:100%; max-width:920px;}
  .home-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:26px; width:340px; flex:1 1 320px;
    display:flex; flex-direction:column; gap:14px;
  }
  .home-card h2{margin:0; font-size:18px; font-weight:800;}
  .home-card h2 span{color:var(--ink-faint); font-weight:500; font-size:13px; display:block; margin-top:3px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.06em;}
  .field input{
    width:100%; background:var(--canvas-alt); border:1px solid var(--line-strong); color:var(--ink);
    border-radius:10px; padding:11px 13px; font-size:14px; outline:none; transition:border-color .15s;
  }
  .field input:focus{border-color:var(--accent);}
  .field input.code{text-transform:uppercase; letter-spacing:0.14em; font-family:'JetBrains Mono',monospace; font-weight:700;}

  .theme-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .theme-card{
    background:var(--canvas-alt); border:1.5px solid var(--line-strong); border-radius:12px;
    padding:12px; text-align:left; color:var(--ink); display:flex; flex-direction:column; gap:8px;
    transition:border-color .15s, transform .1s;
  }
  .theme-card:hover{border-color:var(--ink-faint);}
  .theme-card.selected{border-color:var(--accent); background:var(--accent-dim);}
  .theme-card .t-name{font-weight:700; font-size:13px;}
  .theme-card .t-desc{font-size:11px; color:var(--ink-faint); line-height:1.4;}
  .theme-strip{display:flex; gap:4px;}
  .theme-strip i{flex:1; height:6px; border-radius:3px; display:block;}

  .btn{
    border:none; border-radius:10px; padding:12px 18px; font-weight:700; font-size:14px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .08s, filter .12s; white-space:nowrap;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent); color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line-strong);}
  .btn-ghost:hover{border-color:var(--ink-faint);}
  .btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
  .btn-block{width:100%;}
  .hint-error{color:var(--danger); font-size:12.5px; min-height:16px; margin-top:4px;}

  /* ---------- BOARD SHELL ---------- */
  .board-view{flex:1; display:flex; flex-direction:column; height:100vh;}
  .topbar{
    display:flex; align-items:center; gap:14px; padding:12px 18px;
    background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .room-badge{
    display:flex; align-items:center; gap:8px; background:var(--canvas-alt);
    border:1px dashed var(--line-strong); border-radius:10px; padding:7px 12px; cursor:pointer;
  }
  .room-badge .code{font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:0.12em; font-size:14px;}
  .room-badge .lbl{font-size:10px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em;}
  .theme-pill{
    font-size:12px; color:var(--ink-dim); background:var(--canvas-alt); border-radius:20px;
    padding:6px 12px; display:flex; align-items:center; gap:6px;
  }
  .topbar-spacer{flex:1;}
  .presence{display:flex; align-items:center;}
  .avatar{
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#1a1206; border:2px solid var(--panel); margin-left:-8px;
    position:relative;
  }
  .avatar:first-child{margin-left:0;}
  .avatar[title]:hover::after{
    content:attr(title); position:absolute; top:36px; left:50%; transform:translateX(-50%);
    background:var(--canvas-alt); color:var(--ink); padding:4px 8px; border-radius:6px; font-size:11px;
    white-space:nowrap; z-index:20; border:1px solid var(--line-strong);
  }
  .timer{display:flex; align-items:center; gap:8px;}
  .timer .disp{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; min-width:52px; text-align:center;}
  .timer .disp.done{color:var(--danger);}
  .timer-menu{position:relative;}
  .timer-menu .pop{
    display:none; position:absolute; top:38px; right:0; background:var(--canvas-alt);
    border:1px solid var(--line-strong); border-radius:10px; padding:8px; gap:6px; flex-direction:column; z-index:30; min-width:120px;
  }
  .timer-menu.open .pop{display:flex;}

  .tabs{display:flex; gap:4px; padding:0 18px; background:var(--panel); border-bottom:1px solid var(--line);}
  .tab{
    padding:11px 16px; font-size:13px; font-weight:700; color:var(--ink-faint); background:none; border:none;
    border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  .tab.active{color:var(--ink); border-bottom-color:var(--accent);}

  /* ---------- BOARD ---------- */
  .board{
    flex:1; overflow-x:auto; overflow-y:hidden; display:flex; gap:16px; padding:20px;
  }
  .column{
    min-width:280px; max-width:280px; display:flex; flex-direction:column;
    background:rgba(0,0,0,0.12); border:1px solid var(--line); border-radius:14px; overflow:visible;
  }
  .column-head{
    padding:12px 14px 10px; border-bottom:2px dashed var(--line-strong); position:relative;
    border-radius:14px 14px 0 0; background:rgba(0,0,0,0.08);
  }
  .column-head .tape{
    position:absolute; top:-1px; left:16px; width:44px; height:12px; border-radius:2px; opacity:0.9;
    transform:rotate(-2deg);
  }
  .column-head h3{
    font-family:'Kalam',cursive; font-weight:700; font-size:18px; margin:6px 0 2px; display:flex; align-items:center; gap:6px;
  }
  .column-head .sub{font-size:11px; color:var(--ink-faint);}
  .column-body{flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px; min-height:80px;}
  .column-body.drag-over{background:rgba(255,107,74,0.06);}
  .column-add{padding:10px 12px 14px;}

  .note{
    background:var(--note-1); color:var(--note-1-ink); border-radius:3px 10px 10px 10px;
    padding:14px 12px 10px; font-family:'Kalam',cursive; font-size:14.5px; line-height:1.42;
    box-shadow:0 5px 12px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.15) inset;
    position:relative; cursor:grab; user-select:none;
  }
  .note.dragging{opacity:0.35;}
  .note .pin{
    position:absolute; top:-7px; left:14px; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #ccc 45%, #888 100%);
    box-shadow:0 2px 3px rgba(0,0,0,0.4);
  }
  .note .txt{white-space:pre-wrap; word-break:break-word; margin-bottom:10px;}
  .note .meta{display:flex; align-items:center; justify-content:space-between; gap:6px; font-family:'Manrope',sans-serif;}
  .note .author{font-size:10.5px; font-weight:700; opacity:0.75;}
  .note .actions{display:flex; align-items:center; gap:4px;}
  .vote-btn{
    background:rgba(0,0,0,0.12); border:none; border-radius:20px; padding:3px 8px; font-size:11px;
    font-weight:800; display:flex; align-items:center; gap:4px; color:inherit;
  }
  .vote-btn.mine{background:rgba(0,0,0,0.28);}
  .icon-btn{
    background:rgba(0,0,0,0.1); border:none; border-radius:8px; width:22px; height:22px;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:inherit;
  }
  .note:has(.note-menu.open){z-index:10;}
  .note-menu{position:relative;}
  .note-menu .pop{
    display:none; position:absolute; top:28px; right:0; background:#241a08; color:#F4F1E8;
    border-radius:10px; padding:6px; min-width:170px; z-index:50; box-shadow:0 8px 20px rgba(0,0,0,0.4);
    font-family:'Manrope',sans-serif;
  }
  .note-menu.open .pop{display:block;}
  .note-menu .pop button{
    display:block; width:100%; text-align:left; background:none; border:none; color:inherit;
    padding:8px 9px; font-size:12.5px; border-radius:6px;
  }
  .note-menu .pop button:hover{background:rgba(255,255,255,0.08);}
  .note-menu .pop .sep{height:1px; background:rgba(255,255,255,0.12); margin:4px 2px;}
  .note-menu .pop .danger{color:var(--danger);}

  .composer{
    background:var(--canvas-alt); border:1.5px dashed var(--line-strong); border-radius:10px; padding:8px;
  }
  .composer textarea{
    width:100%; background:none; border:none; color:var(--ink); font-family:'Kalam',cursive; font-size:14px;
    resize:none; outline:none; min-height:44px;
  }
  .composer-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:4px;}
  .add-note-btn{
    width:100%; background:none; border:1.5px dashed var(--line-strong); color:var(--ink-faint);
    border-radius:10px; padding:10px; font-size:12.5px; font-weight:700;
  }
  .add-note-btn:hover{border-color:var(--ink-faint); color:var(--ink);}

  /* ---------- ACTIONS TAB ---------- */
  .actions-view{flex:1; overflow-y:auto; padding:24px 20px 60px; display:flex; justify-content:center;}
  .actions-inner{width:100%; max-width:720px;}
  .actions-inner h2{font-family:'Kalam',cursive; font-size:24px; margin:0 0 4px;}
  .actions-inner .sub{color:var(--ink-faint); font-size:13px; margin-bottom:18px;}
  .todo-composer{
    display:flex; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:18px;
  }
  .todo-composer input{
    flex:1; background:var(--canvas-alt); border:1px solid var(--line-strong); border-radius:8px;
    padding:10px 12px; color:var(--ink); outline:none; font-size:13.5px;
  }
  .todo-composer input:focus{border-color:var(--accent);}
  .todo-list{display:flex; flex-direction:column; gap:8px;}
  .todo-row{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px;
  }
  .todo-row.done{opacity:0.5;}
  .todo-row.done .todo-text{text-decoration:line-through;}
  .check{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--ink-faint); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:11px; background:none; color:var(--ink);
  }
  .check.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .todo-text{flex:1; min-width:0; font-size:13.5px; line-height:1.4; word-break:break-word;}
  .assignee-select{
    background:var(--canvas-alt); border:1px solid var(--line-strong); color:var(--ink-dim);
    border-radius:7px; padding:5px 8px; font-size:11.5px; max-width:120px;
  }
  .todo-empty{color:var(--ink-faint); font-size:13px; text-align:center; padding:30px 0;}

  /* ---------- JOIN VIEW ---------- */
  .join-view{
    flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  .join-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:32px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:16px;
    text-align:center;
  }
  .join-card .brand{
    font-family:'Kalam',cursive; font-weight:700; font-size:32px;
    transform:rotate(-1.5deg); display:inline-block;
  }
  .join-card .brand .dot{color:var(--accent);}
  .join-card .room-info{
    background:var(--canvas-alt); border:1px dashed var(--line-strong); border-radius:10px;
    padding:12px; display:flex; flex-direction:column; gap:4px;
  }
  .join-card .room-info .code{
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:22px; letter-spacing:0.14em;
  }
  .join-card .room-info .theme-name{font-size:13px; color:var(--ink-dim);}

  /* ---------- toast / modal ---------- */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--ink); color:#171712; padding:10px 18px; border-radius:30px; font-size:13px; font-weight:700;
    transition:opacity .2s, transform .2s; z-index:100; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-bg{
    position:fixed; inset:0; background:rgba(10,14,11,0.7); display:flex; align-items:center; justify-content:center;
    z-index:90; padding:20px;
  }
  .modal{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px; max-width:520px; width:100%;}
  .modal h3{font-family:'Kalam',cursive; font-size:20px; margin:0 0 12px;}
  .modal textarea{
    width:100%; min-height:220px; background:var(--canvas-alt); border:1px solid var(--line-strong); color:var(--ink);
    border-radius:10px; padding:12px; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.6; resize:vertical;
  }
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:14px;}

  .color-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .color-dot{
    width:32px; height:32px; border-radius:50%; border:3px solid transparent;
    cursor:pointer; transition:transform .1s, border-color .15s;
    position:relative;
  }
  .color-dot:hover{transform:scale(1.15);}
  .color-dot.selected{border-color:var(--ink); transform:scale(1.15);}
  .color-dot.selected::after{
    content:'✓'; position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; font-size:14px; font-weight:800;
  }

  /* ---------- SAILBOAT VISUAL ---------- */
  .sailboat-view{flex:1; overflow:auto; display:flex; justify-content:center; align-items:flex-start; padding:20px;}
  .visual-container{width:100%; max-width:1100px; flex-shrink:0;}
  .visual-svg{width:100%; height:auto; display:block; border-radius:14px 14px 0 0;}
  .visual-zones{
    display:grid; gap:1px; background:var(--line);
    border-radius:0 0 14px 14px; overflow:hidden;
  }
  .visual-zones.cols-3{grid-template-columns:1fr 1fr 1fr;}
  .visual-zones.cols-4{grid-template-columns:1fr 1fr 1fr 1fr;}
  .vz{
    background:rgba(0,0,0,0.35); padding:14px; display:flex; flex-direction:column; gap:10px;
    min-height:120px;
  }
  .vz-header{
    font-family:'Kalam',cursive; font-weight:700; font-size:15px;
    color:rgba(255,255,255,0.85); display:flex; align-items:center; gap:6px;
    padding-bottom:8px; border-bottom:1px dashed rgba(255,255,255,0.15);
    margin-bottom:4px;
  }
  .vz-notes{display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;}
  .sb-note{
    padding:8px 10px; border-radius:3px 8px 8px 8px; font-family:'Kalam',cursive; font-size:12px;
    line-height:1.3; max-width:160px; box-shadow:0 3px 8px rgba(0,0,0,0.3);
    transform:rotate(var(--rot, 0deg)); word-break:break-word;
    position:relative;
  }
  .sb-note .sb-pin{
    position:absolute; top:-5px; left:10px; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #ccc 45%, #888 100%);
    box-shadow:0 1px 2px rgba(0,0,0,0.4);
  }
  .sb-note .sb-votes{font-family:'Manrope',sans-serif; font-size:9px; font-weight:800; opacity:0.7; margin-top:4px;}
  .sb-note .sb-author{font-family:'Manrope',sans-serif; font-size:9px; font-weight:700; opacity:0.6; margin-top:2px;}
  .sb-empty-hint{
    font-family:'Manrope',sans-serif; font-size:11px; color:rgba(255,255,255,0.4);
    font-style:italic; padding:4px;
  }

  @media (max-width:900px){
    .visual-zones.cols-4{grid-template-columns:1fr 1fr;}
    .visual-zones.cols-3{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .visual-zones.cols-3{grid-template-columns:1fr;}
    .visual-zones.cols-4{grid-template-columns:1fr;}
  }

  @media (max-width:640px){
    .home-cards{flex-direction:column; align-items:stretch;}
    .theme-grid{grid-template-columns:1fr;}
    .topbar{padding:10px 12px;}
    .board{padding:12px; gap:12px;}
    .column{min-width:250px; max-width:250px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================= FIREBASE REST API ============================= */

const FB_URL = "https://retrops-ddec0-default-rtdb.europe-west1.firebasedatabase.app";

const fb = {
  async get(path) {
    const res = await fetch(`${FB_URL}/${path}.json`);
    if (!res.ok) throw new Error(`Firebase GET ${path}: ${res.status}`);
    return res.json(); // returns null if not found
  },
  async set(path, data) {
    const res = await fetch(`${FB_URL}/${path}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`Firebase SET ${path}: ${res.status}`);
    return res.json();
  },
  async update(path, data) {
    const res = await fetch(`${FB_URL}/${path}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });
    if (!res.ok) throw new Error(`Firebase PATCH ${path}: ${res.status}`);
    return res.json();
  },
  async remove(path) {
    const res = await fetch(`${FB_URL}/${path}.json`, { method: "DELETE" });
    if (!res.ok) throw new Error(`Firebase DELETE ${path}: ${res.status}`);
  },
  // SSE listener for real-time updates
  listen(path, callback) {
    const es = new EventSource(`${FB_URL}/${path}.json`);
    es.addEventListener("put", (e) => {
      const data = JSON.parse(e.data);
      callback(data);
    });
    es.addEventListener("patch", (e) => {
      const data = JSON.parse(e.data);
      callback(data);
    });
    es.onerror = () => {
      // EventSource auto-reconnects
    };
    return es; // caller can close with es.close()
  }
};

/* ============================= CONFIG / DATA ============================= */

const THEMES = {

const NOTE_COLORS = ["note-1", "note-2", "note-3", "note-4", "note-5", "note-6"];

/* ============================= UTIL ============================= */

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
function slugify(s) { return (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "user"; }
function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; } return Math.abs(h); }
function colorForName(name) { return NOTE_COLORS[hashStr(name) % NOTE_COLORS.length]; }
function rotForId(id) { return (hashStr(id) % 7) - 3; }
function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function makeCode() {
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let c = ""; for (let i = 0; i < 5; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============================= APP STATE ============================= */

let view = "home"; // home | join | board
let myName = localStorage.getItem('retrops_name') || "";
let myColor = localStorage.getItem('retrops_color') || "note-1";
let selectedTheme = "sstop";
let roomCode = null;
let room = null;
let activeTab = "board";
let presenceList = [];
let pollTimer = null;
let heartbeatTimer = null;
let clockTimer = null;
let openMenus = {};
let composerOpenFor = null;
let roomListener = null; // SSE EventSource
let loading = false;
let urlCode = null; // room code extracted from URL
let joinRoomData = null; // room metadata for join view

/* ============================= FIREBASE SYNC ============================= */

async function createRoom(theme) {
  const code = makeCode();
  const initial = {
    theme,
    createdAt: Date.now(),
    notes: {},
    todos: {},
    timerEndsAt: null
  };
  await fb.set(`rooms/${code}`, initial);
  return code;
}

async function fetchRoom(code) {
  const data = await fb.get(`rooms/${code}`);
  return data;
}

function roomToArrays(data) {
  // Firebase stores objects, we need arrays for rendering
  if (!data) return null;
  return {
    ...data,
    notes: data.notes ? Object.values(data.notes) : [],
    todos: data.todos ? Object.values(data.todos) : []
  };
}

function startListening(code) {
  if (roomListener) roomListener.close();
  
  // Try SSE for instant updates
  try {
    roomListener = fb.listen(`rooms/${code}`, (event) => {
      syncRoom();
    });
  } catch(e) {
    roomListener = null;
  }
}

// Debounced room sync to avoid hammering Firebase
let syncTimeout = null;
function syncRoom() {
  if (syncTimeout) return; // already scheduled
  syncTimeout = setTimeout(async () => {
    syncTimeout = null;
    try {
      const data = await fetchRoom(roomCode);
      if (data) {
        const ta = document.getElementById('composer-input');
        const draft = ta ? ta.value : '';
        room = roomToArrays(data);
        render();
        if (draft && composerOpenFor) {
          const ta2 = document.getElementById('composer-input');
          if (ta2) ta2.value = draft;
        }
      }
    } catch(e) {}
  }, 300);
}

async function sendHeartbeat() {
  try {
    const slug = slugify(myName);
    await fb.set(`presence/${roomCode}/${slug}`, {
      name: myName,
      color: myColor,
      ts: Date.now()
    });
  } catch (e) { }
}

async function pollPresence() {
  try {
    const data = await fb.get(`presence/${roomCode}`);
    if (!data) { presenceList = []; return; }
    const now = Date.now();
    presenceList = Object.values(data).filter(p => p && (now - p.ts) < 25000);
    renderPresenceOnly();
  } catch (e) { }
}

/* ============================= ROOM MUTATIONS ============================= */

async function addNote(columnId, text) {
  const id = uid();
  const note = {
    id, text, author: myName, color: myColor,
    columnId, order: Date.now(), votes: []
  };
  await fb.set(`rooms/${roomCode}/notes/${id}`, note);
}

async function deleteNote(id) {
  await fb.remove(`rooms/${roomCode}/notes/${id}`);
}

async function moveNote(id, newCol) {
  await fb.update(`rooms/${roomCode}/notes/${id}`, { columnId: newCol, order: Date.now() });
}

async function toggleVote(id) {
  // Read current votes, toggle, write back
  const note = await fb.get(`rooms/${roomCode}/notes/${id}`);
  if (!note) return;
  let votes = note.votes || [];
  // Firebase may store as object if sparse — normalize
  if (!Array.isArray(votes)) votes = Object.values(votes);
  const idx = votes.indexOf(myName);
  if (idx >= 0) votes.splice(idx, 1); else votes.push(myName);
  await fb.set(`rooms/${roomCode}/notes/${id}/votes`, votes);
}

async function addTodo(text) {
  const id = uid();
  await fb.set(`rooms/${roomCode}/todos/${id}`, {
    id, text, assignee: "", done: false, order: Date.now()
  });
}

async function toggleTodo(id) {
  const todo = await fb.get(`rooms/${roomCode}/todos/${id}`);
  if (!todo) return;
  await fb.update(`rooms/${roomCode}/todos/${id}`, { done: !todo.done });
}

async function assignTodo(id, assignee) {
  await fb.update(`rooms/${roomCode}/todos/${id}`, { assignee });
}

async function deleteTodo(id) {
  await fb.remove(`rooms/${roomCode}/todos/${id}`);
}

async function noteToTodo(noteId) {
  const note = await fb.get(`rooms/${roomCode}/notes/${noteId}`);
  if (!note) return;
  await addTodo(note.text);
}

async function refreshRoom() {
  const data = await fetchRoom(roomCode);
  if (data) { room = roomToArrays(data); render(); }
}

async function setTimer(minutes) {
  await fb.update(`rooms/${roomCode}`, { timerEndsAt: Date.now() + minutes * 60000 });
}

async function clearTimer() {
  await fb.update(`rooms/${roomCode}`, { timerEndsAt: 0 });
}

/* ============================= NAVIGATION ============================= */

async function enterRoom(code) {
  roomCode = code.toUpperCase();
  loading = true; render();
  try {
    const data = await fetchRoom(roomCode);
    if (!data) { loading = false; render(); showToast("Salle introuvable — vérifie le code."); return false; }
    room = roomToArrays(data);
    view = "board";
    activeTab = "board";
    localStorage.setItem('retrops_name', myName);
    localStorage.setItem('retrops_room', roomCode);
    localStorage.setItem('retrops_color', myColor);
    window.location.hash = roomCode;
    loading = false;
    render();
    startListening(roomCode);
    sendHeartbeat();
    pollPresence();
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    if (pollTimer) clearInterval(pollTimer);
    if (clockTimer) clearInterval(clockTimer);
    if (window._roomPoll) clearInterval(window._roomPoll);
    heartbeatTimer = setInterval(sendHeartbeat, 9000);
    pollTimer = setInterval(pollPresence, 5000);
    clockTimer = setInterval(() => { if (view === 'board') renderTimerOnly(); }, 1000);
    // Fallback polling every 3s in case SSE doesn't work
    window._roomPoll = setInterval(syncRoom, 3000);
    return true;
  } catch (e) {
    loading = false; render();
    showToast("Erreur réseau — vérifie ta connexion.");
    return false;
  }
}

function leaveRoom() {
  if (roomListener) { roomListener.close(); roomListener = null; }
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  if (pollTimer) clearInterval(pollTimer);
  if (clockTimer) clearInterval(clockTimer);
  if (window._roomPoll) clearInterval(window._roomPoll);
  view = "home"; room = null; roomCode = null; presenceList = [];
  localStorage.removeItem('retrops_room');
  window.location.hash = '';
  render();
}

/* ============================= RENDER: BOARD ============================= */

function fmtClock(ms) {
  if (ms <= 0) return "00:00";
  const s = Math.ceil(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return String(m).padStart(2, '0') + ":" + String(r).padStart(2, '0');
}

function renderTimerOnly() {
  const el = document.getElementById('timer-disp');
  if (!el || !room) return;
  if (room.timerEndsAt && room.timerEndsAt > 0) {
    const remain = room.timerEndsAt - Date.now();
    el.textContent = remain > 0 ? fmtClock(remain) : "Fini";
    el.classList.toggle('done', remain <= 0);
  } else {
    el.textContent = "--:--";
    el.classList.remove('done');
  }
}

function renderPresenceOnly() {
  const el = document.getElementById('presence-list');
  if (!el) return;
  el.innerHTML = presenceHtml();
}

function presenceHtml() {
  if (!presenceList.length) return "";
  return presenceList.slice(0, 8).map(p => {
    const cls = p.color || colorForName(p.name);
    const initials = (p.name || "?").slice(0, 2).toUpperCase();
    return `<div class="avatar" style="background:var(--${cls})" title="${escapeHtml(p.name)}">${escapeHtml(initials)}</div>`;
  }).join("");
}

function allAuthors() {
  const set = new Set();
  (room.notes || []).forEach(n => set.add(n.author));
  presenceList.forEach(p => set.add(p.name));
  set.add(myName);
  return Array.from(set).filter(Boolean);
}

function noteHtml(n) {
  const rot = rotForId(n.id);
  let votes = n.votes || [];
  if (!Array.isArray(votes)) votes = Object.values(votes);
  const myVote = votes.includes(myName);
  const isMine = n.author === myName;
  const menuOpen = openMenus['note:' + n.id] ? 'open' : '';
  const cols = THEMES[room.theme].columns;
  const moveOptions = cols.filter(c => c.id !== n.columnId).map(c =>
    `<button data-action="move-note" data-id="${n.id}" data-col="${c.id}">→ ${escapeHtml(c.label)}</button>`
  ).join("");
  return `
  <div class="note" style="background:var(--${n.color});color:var(--${n.color}-ink);transform:rotate(${rot}deg)" draggable="true" data-note-id="${n.id}">
    <div class="pin"></div>
    <div class="txt">${escapeHtml(n.text)}</div>
    <div class="meta">
      <span class="author">${escapeHtml(n.author)}</span>
      <div class="actions">
        <button class="vote-btn ${myVote ? 'mine' : ''}" data-action="vote" data-id="${n.id}" title="Voter">❤ ${votes.length || ''}</button>
        <div class="note-menu ${menuOpen}">
          <button class="icon-btn" data-action="toggle-note-menu" data-id="${n.id}">⋯</button>
          <div class="pop">
            <button data-action="to-todo" data-id="${n.id}">📌 Créer une action</button>
            <div class="sep"></div>
            ${moveOptions}
            ${isMine ? `<div class="sep"></div><button class="danger" data-action="delete-note" data-id="${n.id}">🗑 Supprimer</button>` : ""}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function columnHtml(col) {
  const notes = (room.notes || []).filter(n => n.columnId === col.id).sort((a, b) => a.order - b.order);
  const notesHtml = notes.map(noteHtml).join("");
  const composerOpen = composerOpenFor === col.id;
  return `
  <div class="column" data-col-id="${col.id}">
    <div class="column-head">
      <div class="tape" style="background:${col.tape}"></div>
      <h3>${col.icon || ""} ${escapeHtml(col.label)}</h3>
      <div class="sub">${notes.length} post-it${notes.length > 1 ? 's' : ''}</div>
    </div>
    <div class="column-body" data-col-id="${col.id}">
      ${notesHtml}
    </div>
    <div class="column-add">
      ${composerOpen ? `
        <div class="composer">
          <textarea id="composer-input" placeholder="Écris ton idée…" autofocus></textarea>
          <div class="composer-actions">
            <button class="btn btn-ghost btn-sm" data-action="cancel-add" data-col="${col.id}">Annuler</button>
            <button class="btn btn-primary btn-sm" data-action="submit-add" data-col="${col.id}">Ajouter</button>
          </div>
        </div>
      ` : `<button class="add-note-btn" data-action="open-add" data-col="${col.id}">+ Ajouter un post-it</button>`}
    </div>
  </div>`;
}

function actionsViewHtml() {
  const todos = (room.todos || []).slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || a.order - b.order);
  const authors = allAuthors();
  const rows = todos.map(t => {
    const opts = ['<option value="">Non assigné</option>']
      .concat(authors.map(a => `<option value="${escapeHtml(a)}" ${t.assignee === a ? 'selected' : ''}>${escapeHtml(a)}</option>`)).join("");
    return `
    <div class="todo-row ${t.done ? 'done' : ''}">
      <button class="check ${t.done ? 'on' : ''}" data-action="toggle-todo" data-id="${t.id}">${t.done ? '✓' : ''}</button>
      <div class="todo-text">${escapeHtml(t.text)}</div>
      <select class="assignee-select" data-action="assign-todo" data-id="${t.id}">${opts}</select>
      <button class="icon-btn" data-action="delete-todo" data-id="${t.id}" title="Supprimer">✕</button>
    </div>`;
  }).join("");

  return `
  <div class="actions-view">
    <div class="actions-inner">
      <h2>Plan d'action</h2>
      <div class="sub">Les actions concrètes qui sortent de cette rétro.</div>
      <div class="todo-composer">
        <input id="new-todo-input" type="text" placeholder="Nouvelle action à mener…" maxlength="140">
        <button class="btn btn-primary btn-sm" data-action="add-todo">Ajouter</button>
      </div>
      <div class="todo-list">
        ${todos.length ? rows : `<div class="todo-empty">Aucune action pour l'instant. Clique sur un post-it → « Créer une action », ou ajoute-en une directement ici.</div>`}
      </div>
    </div>
  </div>`;
}

    <div class="board-view">
      <div class="topbar">
        <div class="room-badge" data-action="copy-code" title="Copier le lien de la salle">
          <div><div class="lbl">Salle</div><div class="code">${roomCode}</div></div>
        </div>
        <div class="theme-pill">${themeDef.name}</div>
        <div class="topbar-spacer"></div>
        <div class="presence" id="presence-list">${presenceHtml()}</div>
        <div class="timer-menu ${timerOpen}">
          <button class="btn btn-ghost btn-sm" data-action="toggle-timer-menu">
            ⏱ <span id="timer-disp" class="disp ${remain !== null && remain <= 0 ? 'done' : ''}">${timerActive ? (remain > 0 ? fmtClock(remain) : 'Fini') : '--:--'}</span>
          </button>
          <div class="pop">
            <button class="btn btn-ghost btn-sm btn-block" data-action="start-timer" data-min="5">5 min</button>
            <button class="btn btn-ghost btn-sm btn-block" data-action="start-timer" data-min="10">10 min</button>
            <button class="btn btn-ghost btn-sm btn-block" data-action="start-timer" data-min="15">15 min</button>
            <button class="btn btn-ghost btn-sm btn-block" data-action="clear-timer">Arrêter</button>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm" data-action="open-export">Exporter</button>
        <button class="btn btn-ghost btn-sm" data-action="leave-room">Quitter</button>
      </div>
      <div class="tabs">
        <button class="tab ${activeTab === 'board' ? 'active' : ''}" data-action="set-tab" data-tab="board">Tableau</button>
        ${room.theme === 'sailboat' ? `<button class="tab ${activeTab === 'visual' ? 'active' : ''}" data-action="set-tab" data-tab="visual">⛵ Vue Sailboat</button>` : room.theme === 'msg' ? `<button class="tab ${activeTab === 'visual' ? 'active' : ''}" data-action="set-tab" data-tab="visual">🌦 Vue Météo</button>` : room.theme === 'fourls' ? `<button class="tab ${activeTab === 'visual' ? 'active' : ''}" data-action="set-tab" data-tab="visual">⛰ Vue Montagne</button>` : ''}

      </div>
      ${activeTab === 'board' ? `<div class="board">${themeDef.columns.map(columnHtml).join("")}</div>` : activeTab === 'visual' ? (room.theme === 'msg' ? msgViewHtml() : room.theme === 'fourls' ? fourlsViewHtml() : sailboatViewHtml()) : actionsViewHtml()}
    </div>
    <div id="modal-root"></div>
  `;

function sbNoteHtml(n) {
  const rot = rotForId(n.id);

  if (!Array.isArray(votes)) votes = Object.values(votes);
  const voteStr = votes.length ? `<div class="sb-votes">❤ ${votes.length}</div>` : '';
  return `<div class="sb-note" style="background:var(--${n.color});color:var(--${n.color}-ink);--rot:${rot}deg">
    <div class="sb-pin"></div>
    ${escapeHtml(n.text)}
    ${voteStr}
    <div class="sb-author">${escapeHtml(n.author)}</div>
  </div>`;
}

  const themeDef = THEMES[room.theme];
  const date = new Date(room.createdAt || Date.now()).toLocaleDateString('fr-FR');
  let md = `# Rétrospective — ${themeDef.name}\n_${date} — salle ${roomCode}_\n\n`;
  themeDef.columns.forEach(col => {
    const notes = (room.notes || []).filter(n => n.columnId === col.id).sort((a, b) => {
      const va = Array.isArray(a.votes) ? a.votes.length : 0;
      const vb = Array.isArray(b.votes) ? b.votes.length : 0;
      return vb - va;
    });
    md += `## ${col.icon || ""} ${col.label}\n`;
    if (!notes.length) md += `_Rien ici_\n`;
    notes.forEach(n => {
      const v = Array.isArray(n.votes) ? n.votes.length : 0;
      const votes = v ? ` (❤ ${v})` : "";
      md += `- ${n.text} — *${n.author}*${votes}\n`;
    });
    md += `\n`;
  });
  md += `## ✅ Plan d'action\n`;
  const todos = room.todos || [];
  if (!todos.length) md += `_Aucune action définie_\n`;
  todos.forEach(t => {
    md += `- [${t.done ? 'x' : ' '}] ${t.text}${t.assignee ? ' — *' + t.assignee + '*' : ''}\n`;
  });
  return md;
}

function openExportModal() {
  const md = buildMarkdown();
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" data-action="close-modal">
      <div class="modal" onclick="if(!event.target.closest('[data-action=close-modal]'))event.stopPropagation()">
        <h3>Exporter la rétro</h3>
        <textarea readonly id="export-text">${escapeHtml(md)}</textarea>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-action="close-modal">Fermer</button>
          <button class="btn btn-primary" data-action="copy-export">Copier</button>
        </div>
      </div>
    </div>`;
}

/* ============================= RENDER DISPATCH ============================= */

function render() {
  if (loading) {
    document.getElementById('app').innerHTML = `<div class="loading-overlay"><div class="spinner"></div></div>`;
    return;
  }
  if (view === "home") renderHome();
  else if (view === "join") renderJoin();
  else renderBoard();
  requestAnimationFrame(() => {
    const scene = document.querySelector('.visual-container');
    if (!scene) return;
    let maxBottom = 700;
    scene.querySelectorAll('.sb-zone').forEach(z => {
      maxBottom = Math.max(maxBottom, z.offsetTop + z.offsetHeight);
    });
    scene.style.minHeight = (maxBottom + 20) + 'px';
  });
}

/* ============================= DRAG & DROP ============================= */

function attachDnd() {
  document.querySelectorAll('.note[draggable="true"]').forEach(el => {
    el.addEventListener('dragstart', e => {
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', el.dataset.noteId);
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); });
  });
  document.querySelectorAll('.column-body').forEach(body => {
    body.addEventListener('dragover', e => {
      e.preventDefault();
      body.classList.add('drag-over');
    });
    body.addEventListener('dragleave', () => { body.classList.remove('drag-over'); });
    body.addEventListener('drop', async e => {
      e.preventDefault();
      body.classList.remove('drag-over');
      const noteId = e.dataTransfer.getData('text/plain');
      const colId = body.dataset.colId;
      if (noteId && colId) {
        await moveNote(noteId, colId);
      }
    });
  });
}

/* ============================= EVENTS ============================= */

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action]');

  if (!e.target.closest('.note-menu')) { Object.keys(openMenus).forEach(k => { if (k.startsWith('note:')) openMenus[k] = false; }); }
  if (!e.target.closest('.timer-menu')) { openMenus['timer'] = false; }

  if (!btn) { return; }
  const action = btn.dataset.action;

  switch (action) {
    case 'pick-theme':
      selectedTheme = btn.dataset.theme; render(); break;

    case 'pick-color':
      myColor = btn.dataset.color; render(); break;

    case 'create-room': {
      const nameInput = document.getElementById('create-name');
      const err = document.getElementById('create-error');
      const name = nameInput.value.trim();
      if (!name) { err.textContent = "Entre ton prénom pour continuer."; return; }
      myName = name;
      btn.disabled = true; btn.textContent = "Création…";
      try {
        const code = await createRoom(selectedTheme);
        await enterRoom(code);
      } catch (ex) {
        console.error(ex);
        err.textContent = "Impossible de créer la salle. Réessaie.";
        btn.disabled = false; btn.textContent = "Créer la salle →";
      }
      break;
    }

    case 'join-room': {
      const nameInput = document.getElementById('join-name');
      const codeInput = document.getElementById('join-code');
      const err = document.getElementById('join-error');
      const name = nameInput.value.trim();
      const code = codeInput.value.trim();
      if (!name) { err.textContent = "Entre ton prénom pour continuer."; return; }
      if (!code) { err.textContent = "Entre le code de la salle."; return; }
      myName = name;
      btn.disabled = true; btn.textContent = "Connexion…";
      const ok = await enterRoom(code);
      if (!ok) { err.textContent = "Salle introuvable — vérifie le code."; btn.disabled = false; btn.textContent = "Rejoindre →"; }
      break;
    }

    case 'join-room-url': {
      const nameInput = document.getElementById('join-url-name');
      const err = document.getElementById('join-url-error');
      const name = nameInput.value.trim();
      if (!name) { err.textContent = "Entre ton prénom pour continuer."; return; }
      myName = name;
      btn.disabled = true; btn.textContent = "Connexion…";
      const ok = await enterRoom(urlCode);
      if (!ok) { err.textContent = "Salle introuvable."; btn.disabled = false; btn.textContent = "Rejoindre la rétro →"; }
      break;
    }

    case 'leave-room': leaveRoom(); break;

    case 'copy-code': {
      const shareUrl = `${window.location.origin}/#${roomCode}`;
      navigator.clipboard.writeText(shareUrl).then(() => showToast("Lien copié !"));
      break;
    }

    case 'set-tab': activeTab = btn.dataset.tab; render(); break;

    case 'open-add':
      composerOpenFor = btn.dataset.col; render();
      setTimeout(() => { const ta = document.getElementById('composer-input'); if (ta) ta.focus(); }, 0);
      break;
    case 'cancel-add': composerOpenFor = null; render(); break;
    case 'submit-add': {
      const ta = document.getElementById('composer-input');
      const text = ta.value.trim();
      const colId = btn.dataset.col;
      if (!text) { composerOpenFor = null; render(); return; }
      composerOpenFor = null;
      await addNote(colId, text);
      render();
      break;
    }

    case 'vote': await toggleVote(btn.dataset.id); break;

    case 'toggle-note-menu': {
      const id = btn.dataset.id;
      const key = 'note:' + id;
      const wasOpen = openMenus[key];
      Object.keys(openMenus).forEach(k => { if (k.startsWith('note:')) openMenus[k] = false; });
      openMenus[key] = !wasOpen;
      render();
      break;
    }

    case 'move-note': await moveNote(btn.dataset.id, btn.dataset.col); break;
    case 'delete-note': await deleteNote(btn.dataset.id); break;

    case 'to-todo': {
      await noteToTodo(btn.dataset.id);
      await refreshRoom();
      showToast("Action créée ✓");
      break;
    }

    case 'add-todo': {
      const input = document.getElementById('new-todo-input');
      const text = input.value.trim();
      if (!text) return;
      await addTodo(text);
      await refreshRoom();
      break;
    }
    case 'toggle-todo': await toggleTodo(btn.dataset.id); await refreshRoom(); break;
    case 'delete-todo': await deleteTodo(btn.dataset.id); await refreshRoom(); break;

    case 'toggle-timer-menu': openMenus['timer'] = !openMenus['timer']; render(); break;
    case 'start-timer': {
      await setTimer(parseInt(btn.dataset.min, 10));
      openMenus['timer'] = false;
      await refreshRoom();
      break;
    }
    case 'clear-timer': { await clearTimer(); openMenus['timer'] = false; await refreshRoom(); break; }

    case 'open-export': openExportModal(); break;
    case 'close-modal': document.getElementById('modal-root').innerHTML = ''; break;
    case 'copy-export': {
      const ta = document.getElementById('export-text');
      navigator.clipboard.writeText(ta.value).then(() => showToast("Rétro copiée dans le presse-papiers ✓"));
      break;
    }
  }
});

document.addEventListener('change', async (e) => {
  if (e.target.matches('[data-action="assign-todo"]')) {
    await assignTodo(e.target.dataset.id, e.target.value);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'new-todo-input') {
    e.preventDefault();
    document.querySelector('[data-action="add-todo"]').click();
  }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'composer-input') {
    e.preventDefault();
    const submitBtn = document.querySelector('[data-action="submit-add"]');
    if (submitBtn) submitBtn.click();
  }
});

/* ============================= BOOT ============================= */
(async function boot() {
  // Check if URL hash contains a room code (e.g. #AB3XZ)
  const hashCode = window.location.hash.replace(/^#/, '').toUpperCase();
  const isCode = /^[A-Z0-9]{4,6}$/.test(hashCode);

  const savedRoom = localStorage.getItem('retrops_room');
  const savedName = localStorage.getItem('retrops_name');

  if (isCode && savedRoom === hashCode && savedName) {
    // Already in this room, rejoin directly
    myName = savedName;
    myColor = localStorage.getItem('retrops_color') || "note-1";
    const ok = await enterRoom(hashCode);
    if (!ok) {
      localStorage.removeItem('retrops_room');
      urlCode = hashCode;
      view = "join";
      render();
    }
  } else if (isCode) {
    // Hash has a room code — show join view
    urlCode = hashCode;
    loading = true; render();
    try {
      joinRoomData = await fetchRoom(urlCode);
      loading = false;
      if (joinRoomData) {
        view = "join";
        render();
      } else {
        showToast("Salle introuvable.");
        window.location.hash = '';
        render();
      }
    } catch (e) {
      loading = false;
      showToast("Erreur réseau.");
      render();
    }
  } else if (savedRoom && savedName) {
    // No hash code but saved session — rejoin
    myName = savedName;
    myColor = localStorage.getItem('retrops_color') || "note-1";
    const ok = await enterRoom(savedRoom);
    if (!ok) {
      localStorage.removeItem('retrops_room');
      render();
    }
  } else {
    render();
  }
})();
</script>
